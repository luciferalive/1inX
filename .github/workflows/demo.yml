name: Demo and CLI check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild generated files from source
        run: node scripts/build-demo.mjs
      - name: Generated files must be committed and up to date
        run: git diff --exit-code docs/ cli/src/
      - name: Demo and terminal tool must match the real engine
        run: node scripts/check-demo-parity.mjs
      - name: Terminal tool tests
        run: node scripts/test-cli.mjs
